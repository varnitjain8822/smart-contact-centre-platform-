name: smartcc

# Profiles (pick one; COMPOSE_PROFILES=dev in .env is the default):
#   dev  — Chatwoot rails dev server + vite + mailhog, portal via vite preview on WEB_PORT, api on 127.0.0.1:4000
#   prod — Chatwoot production image, Caddy HTTPS on https://smartcc.localhost + https://agent.smartcc.localhost
# Never run both at once: dev and prod share the network names `api` and `rails` (Chatwoot webhooks call http://api:4000).
# `make up` / `make prod` stop the other profile first.
include:
  - path:
      - chatwoot/docker-compose.yaml
      - docker/chatwoot.override.yml

x-ops: &ops
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-chatwoot-prod: &chatwoot-prod
  <<: *ops
  profiles: [prod]
  image: smartcc-chatwoot:production
  build:
    context: ./chatwoot
    # mirror of the fork's production Dockerfile; docker/chatwoot.Dockerfile.dockerignore keeps chatwoot/core out of the context
    dockerfile: ../docker/chatwoot.Dockerfile
  env_file: chatwoot/.env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: "true"
    FRONTEND_URL: https://agent.smartcc.localhost
    FORCE_SSL: "false"                 # Caddy terminates TLS and sends X-Forwarded-Proto: https
    POSTGRES_DATABASE: chatwoot_dev    # same database as the dev profile: accounts, tokens and inbox ids carry over
  volumes:
    - ./chatwoot/storage:/app/storage  # same ActiveStorage dir the dev profile uses (./ is mounted at /app there)
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  mongo:
    <<: *ops
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run node scripts/init-env.mjs}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?run node scripts/init-env.mjs}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *ops
    profiles: [dev]
    build: ./api
    env_file: .env
    environment:
      MONGO_URL: mongodb://smartcc_app:${MONGO_APP_PASSWORD}@mongo:27017/smartcc?authSource=smartcc
      MONGO_ROOT_PASSWORD: ""          # the app only gets its least-privilege user
      MONGO_APP_PASSWORD: ""
      CHATWOOT_URL: http://rails:3000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      PUBLIC_URL: http://localhost:${WEB_PORT:-5173}
      UPLOAD_DIR: /data/uploads
      EMBED_CACHE_DIR: /data/models      # KB embedding model (~140 MB), downloaded on first boot
      SMTP_URL: smtp://mailhog:1025
    stop_grace_period: 15s             # api drains SSE for SHUTDOWN_GRACE_MS (10s)
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-prod:
    extends: api
    profiles: !override [prod]
    environment:
      WEB_ORIGIN: https://smartcc.localhost
      PUBLIC_URL: https://smartcc.localhost
      COOKIE_SECURE: "true"
      SMTP_URL: ${SMTP_URL:-}
    ports: !reset []
    depends_on:
      mongo: { condition: service_healthy }
    networks:
      default:
        aliases: [api]

  web:
    <<: *ops
    profiles: [dev]
    build: { context: ./web, target: preview }
    environment:
      API_URL: http://api:4000
    ports:
      - ${WEB_PORT:-5173}:5173
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3

  rails-prod:
    <<: *chatwoot-prod
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      default:
        aliases: [rails]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  sidekiq-prod:
    <<: *chatwoot-prod
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    <<: *ops
    profiles: [prod]
    image: smartcc-caddy
    build: { context: ./web, target: static }   # caddy + the web static build in /srv
    ports:
      - 127.0.0.1:${HTTPS_PORT:-443}:443
      - 127.0.0.1:${HTTP_PORT:-80}:80
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                         # internal CA + certs
    depends_on:
      - api-prod
      - rails-prod
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  uploads:
  models:
  caddy-data:
