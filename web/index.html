<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0F15" media="(prefers-color-scheme: dark)" />
    <title>SmartCC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%233D35C8' stroke-width='4' stroke-dasharray='56 100' transform='rotate(-90 16 16)' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Pre-paint theme (lld-frontend §18): avoid a flash of the wrong theme.
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('scc-theme') || 'system'; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
